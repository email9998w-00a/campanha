<!doctype html>
<!-- Arquivo único: CSS e JavaScript incorporados. -->
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#f4f1ea" />
    <meta name="description" content="Copie a chave PIX e conclua a doação no aplicativo do seu banco." />
    <title>Ajude essa causa</title>
    <style>
:root {
  color-scheme: light;
  font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  font-synthesis: none;
  text-rendering: optimizeLegibility;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
  --canvas: #f4f1ea;
  --header-red: #a83c32;
  --green: #17824d;
  --green-hover: #126a3f;
  --ink: #252823;
  --muted: #62665f;
}

* {
  box-sizing: border-box;
}

html {
  min-width: 320px;
  min-height: 100%;
  background: var(--canvas);
}

body {
  min-width: 320px;
  min-height: 100vh;
  min-height: 100svh;
  margin: 0;
  background: var(--canvas);
  color: var(--ink);
}

button {
  font: inherit;
}

.page-shell {
  display: grid;
  min-height: 100vh;
  min-height: 100svh;
  place-items: center;
  padding: 24px 16px;
}

.donation-card {
  width: min(100%, 370px);
  overflow: hidden;
  border: 1px solid rgb(52 43 34 / 7%);
  border-radius: 20px;
  background: #fff;
  box-shadow: 0 18px 48px rgb(53 44 35 / 12%), 0 3px 10px rgb(53 44 35 / 5%);
}

.card-header {
  padding: 25px 22px 22px;
  background: var(--header-red);
  color: #fff;
  text-align: center;
}

.heart {
  display: grid;
  width: 42px;
  height: 42px;
  place-items: center;
  margin: 0 auto 10px;
  color: #ffd15c;
}

.heart svg {
  width: 40px;
  height: 40px;
}

.card-header h1 {
  margin: 0;
  font-size: 24px;
  font-weight: 760;
  letter-spacing: -0.6px;
  line-height: 1.2;
}

.card-header p {
  max-width: 280px;
  margin: 8px auto 0;
  color: #fff;
  font-size: 13px;
  font-weight: 550;
  line-height: 1.5;
}

.card-content {
  padding: 22px 22px 20px;
  text-align: center;
}

.field-heading {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  margin-bottom: 9px;
  color: #812f29;
  font-size: 11px;
  font-weight: 850;
  letter-spacing: 0.65px;
}

.demo-badge {
  padding: 3px 7px;
  border-radius: 999px;
  background: #fff2ce;
  color: #684b0c;
  font-size: 9px;
  letter-spacing: 0.3px;
}

.demo-badge[hidden] {
  display: none;
}

.pix-key {
  display: grid;
  min-height: 50px;
  place-items: center;
  margin: 0 0 13px;
  padding: 11px 12px;
  border: 1.5px dashed #bd695f;
  border-radius: 11px;
  background: #fcfaf8;
  color: #252823;
  font-family: "SFMono-Regular", Consolas, "Liberation Mono", monospace;
  font-size: 13px;
  font-weight: 700;
  line-height: 1.5;
  overflow-wrap: anywhere;
  user-select: text;
}

.copy-button {
  display: inline-flex;
  width: 100%;
  min-height: 54px;
  align-items: center;
  justify-content: center;
  gap: 9px;
  padding: 0 16px;
  border: 0;
  border-radius: 11px;
  background: var(--green);
  color: #fff;
  cursor: pointer;
  font-size: 14px;
  font-weight: 800;
  transition: background-color 140ms ease, transform 140ms ease;
}

.copy-button:hover {
  background: var(--green-hover);
}

.copy-button:active {
  transform: translateY(1px);
}

.copy-button:focus-visible {
  outline: 3px solid #302718;
  outline-offset: 3px;
  box-shadow: 0 0 0 5px #ffcf57;
}

.copy-button.is-copied {
  background: #126b40;
}

.copy-icon {
  width: 18px;
  height: 18px;
  flex: 0 0 auto;
}

.copy-status {
  margin: 9px 0 0;
  color: #176a40;
  font-size: 12px;
  font-weight: 700;
  line-height: 1.5;
}

.copy-status:empty {
  display: none;
}

.copy-status[data-state="error"] {
  color: #9c3229;
}

.recipient {
  margin: 14px 0 0;
  padding-top: 11px;
  border-top: 1px solid #eeeae5;
  color: var(--muted);
  font-size: 11px;
  line-height: 1.5;
  overflow-wrap: anywhere;
}

.recipient strong {
  color: #41443d;
  font-weight: 750;
}

@media (max-width: 380px) {
  .donation-card {
    border-radius: 17px;
  }

  .card-header {
    padding: 23px 18px 20px;
  }

  .card-content {
    padding: 20px 17px 18px;
  }

  .card-header h1 {
    font-size: 22px;
  }
}

@media (prefers-reduced-motion: reduce) {
  *,
  *::before,
  *::after {
    scroll-behavior: auto !important;
    transition-duration: 0.01ms !important;
  }
}

    </style>
  </head>
  <body>
    <main class="page-shell">
      <section class="donation-card" aria-labelledby="page-title">
        <header class="card-header">
          <span class="heart" aria-hidden="true">
            <svg viewBox="0 0 48 48"><path d="M24 41 9.2 26.9C2.8 20.8 5.3 9.5 14.1 9.5c4.4 0 7.6 2.6 9.9 6.6 2.3-4 5.5-6.6 9.9-6.6 8.8 0 11.3 11.3 4.9 17.4L24 41Z" fill="currentColor" /></svg>
          </span>
          <h1 id="page-title">Ajude essa causa</h1>
          <p>Copie a chave e conclua a doação no app do seu banco.</p>
        </header>

        <div class="card-content">
          <div class="field-heading">
            <span id="pixKeyLabel">CHAVE PIX</span>
            <span class="demo-badge" id="demoBadge">DEMONSTRAÇÃO</span>
          </div>

          <p class="pix-key" id="pixKey" aria-labelledby="pixKeyLabel">SUA-CHAVE-PIX-AQUI</p>

          <button class="copy-button" id="copyButton" type="button">
            <svg class="copy-icon" viewBox="0 0 24 24" aria-hidden="true">
              <rect x="8" y="8" width="12" height="12" rx="2" fill="none" stroke="currentColor" stroke-width="1.9" />
              <path d="M16 8V5a2 2 0 0 0-2-2H5a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h3" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" />
            </svg>
            <span class="button-label">Copiar chave PIX</span>
          </button>

          <p class="copy-status" id="copyStatus" role="status" aria-live="polite" aria-atomic="true"></p>

          <p class="recipient">Recebedor: <strong id="recipientName">NOME DO BENEFICIÁRIO (DEMONSTRAÇÃO)</strong></p>
        </div>
      </section>
    </main>
    <script>
// Substitua a chave e o nome abaixo pelos dados reais antes de divulgar.
const pixConfig = {
  pixKey: "SUA-CHAVE-PIX-AQUI",
  recipient: "NOME DO BENEFICIÁRIO (DEMONSTRAÇÃO)",
  demoMode: true,
};

const pixKeyElement = document.querySelector("#pixKey");
const recipientElement = document.querySelector("#recipientName");
const demoBadge = document.querySelector("#demoBadge");
const copyButton = document.querySelector("#copyButton");
const buttonLabel = copyButton.querySelector(".button-label");
const copyStatus = document.querySelector("#copyStatus");
const defaultButtonLabel = "Copiar chave PIX";
let resetTimer;

pixKeyElement.textContent = pixConfig.pixKey;
recipientElement.textContent = pixConfig.recipient;

const hasDemoValues =
  pixConfig.pixKey === "SUA-CHAVE-PIX-AQUI" ||
  pixConfig.recipient === "NOME DO BENEFICIÁRIO (DEMONSTRAÇÃO)";
demoBadge.hidden = !(pixConfig.demoMode || hasDemoValues);

function copyWithFallback(text) {
  const input = document.createElement("textarea");
  input.value = text;
  input.setAttribute("readonly", "");
  input.setAttribute("aria-hidden", "true");
  input.style.position = "fixed";
  input.style.left = "-9999px";
  document.body.append(input);
  input.select();

  let copied = false;
  try {
    copied = document.execCommand("copy");
  } catch {
    copied = false;
  }

  input.remove();
  return copied;
}

async function copyPixKey() {
  window.clearTimeout(resetTimer);
  copyStatus.textContent = "";
  copyStatus.removeAttribute("data-state");

  let copied = false;
  if (navigator.clipboard?.writeText && window.isSecureContext) {
    try {
      await navigator.clipboard.writeText(pixConfig.pixKey);
      copied = true;
    } catch {
      copied = copyWithFallback(pixConfig.pixKey);
    }
  } else {
    copied = copyWithFallback(pixConfig.pixKey);
  }

  if (copied) {
    buttonLabel.textContent = "Chave copiada!";
    copyButton.classList.add("is-copied");
    copyStatus.textContent = pixConfig.demoMode || hasDemoValues
      ? "Chave demonstrativa copiada. Substitua os dados antes de divulgar."
      : "Chave copiada. Cole no app do seu banco para concluir a doação.";
  } else {
    buttonLabel.textContent = defaultButtonLabel;
    copyButton.classList.remove("is-copied");
    copyStatus.dataset.state = "error";
    copyStatus.textContent = "Não foi possível copiar. Selecione a chave e copie manualmente.";
  }

  resetTimer = window.setTimeout(() => {
    buttonLabel.textContent = defaultButtonLabel;
    copyButton.classList.remove("is-copied");
  }, 2200);
}

copyButton.addEventListener("click", copyPixKey);

    </script>
  </body>
</html>
